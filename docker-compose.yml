# Padel Stats on a Raspberry Pi 5 — two containers, no broker, no object store.
#
# Previously this file ran seven services (postgres, redis, minio, migrate,
# api, worker, flower, nginx) on an 8 GB board serving one user. The queue is
# now a SQLite table, storage is the SSD, and the API serves the web UI, so
# what is left is the API and the analysis worker sharing one image.
#
#   docker compose up -d --build
#
# Both services need DATA_DIR to point at the same volume: the SQLite file and
# the videos live there.

name: padelstats

x-common: &common
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: padelstats:latest
  restart: unless-stopped
  env_file: .env
  environment:
    DATA_DIR: /data
    DETECTOR_MODEL: /srv/weights/yolov8n.onnx
    # Taken from .env when set there, so the larger model can be chosen
    # without editing this file.
    REID_MODEL: ${REID_MODEL:-/srv/weights/osnet_x0_25_msmt17.onnx}
  volumes:
    # Mount the SSD here. An SD card works but wears out quickly with WAL.
    - ${DATA_VOLUME:-./data}:/data
    - ./weights:/srv/weights
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  api:
    <<: *common
    container_name: padel-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 700M

  worker:
    <<: *common
    container_name: padel-worker
    command: python -m app.worker.runner
    depends_on:
      - api
    # The worker is the only heavy consumer on the board. Leaving it ~5 GB of
    # the 8 GB keeps the page cache warm for video decode, which is where the
    # analysis actually spends its time.
    deploy:
      resources:
        limits:
          memory: 5G
