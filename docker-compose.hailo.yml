# Raspberry Pi AI HAT+ (Hailo): gives the analysis worker the board.
#
# Added to docker-compose.yml by a line in .env, which scripts/hailo_setup.sh
# writes once the board answers on the host:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.hailo.yml
#
# Without the board, remove that line: Docker refuses to start a container
# whose device is missing. The worker itself finds the board on its own and
# falls back to the CPU when it cannot use it (backend/app/ml/accel.py).

services:
  worker:
    devices:
      - /dev/hailo0:/dev/hailo0
