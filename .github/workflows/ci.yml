# The previous version of this project had 67 commits, several titled
# "improve: ball tracking accuracy", and zero tests. For a computer-vision
# system that is the decisive defect: nothing that was changed could be shown
# to be an improvement. This workflow exists so that stops being true.
name: CI

# Triggers are split so that no commit is ever tested twice.
#
# Listening to `push` on every branch AND to `pull_request` meant that a push
# to a branch with an open PR started two identical runs of every job: same
# commit, same result, double the wall time and the runner minutes. `push` is
# now limited to the default branch (which has no PR of its own), and every
# branch is covered by `pull_request` from the moment its PR opens.
#
# The trade-off, accepted deliberately: a branch pushed without a PR gets no
# CI until the PR is opened. Work here always goes through a PR, and the
# pull_request trigger has the better semantics anyway — it tests the merge
# result, not the branch in isolation.
on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes a run still in flight for the same ref, so a quick
# follow-up fix does not queue behind the commit it replaces. Runs on main are
# never cancelled: that history is what every other result is compared against.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.dev.txt

      - name: Run tests
        working-directory: backend
        env:
          DATA_DIR: ${{ runner.temp }}/padel-data
        run: python -m pytest -q

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
